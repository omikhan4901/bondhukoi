# Local Supabase stack (`npx supabase start`). Production settings are applied in the
# dashboard; docs/deploy.md lists every one of them.
project_id = "bondhukoi"

[api]
port = 54321
schemas = ["graphql_public"]  # nothing in public is exposed through the Data API

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.snapshots]
public = false
file_size_limit = "2MiB"
allowed_mime_types = ["image/jpeg"]

[auth]
enabled = true
site_url = "bondhukoi://"
additional_redirect_urls = ["bondhukoi://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
