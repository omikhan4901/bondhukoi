name: Keep-alive and uptime

# Once a day: checks the API and its database are up. The database query also stops the
# free Supabase project from pausing after a quiet week. A failed run emails the owner.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    env:
      ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
    steps:
      - run: curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 20 "${{ vars.API_URL }}/health"
      - name: Admin alerts (emails only when something needs attention)
        if: env.ALERTS_SECRET != ''
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "x-alerts-secret: $ALERTS_SECRET" "${{ vars.API_URL }}/api/internal/alerts"
