# One grouped pull request a week per package, minor and patch updates only.
# Major versions are upgraded by hand. Expo and React Native packages are never bumped
# here: they must move together with `npx expo install --fix` / `npx expo upgrade`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      backend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      admin:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /frontend/BondhuKoiApp
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      app:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@sentry/react-native'
      - dependency-name: 'jest-expo'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'eslint-config-expo'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
